<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>made by kaiis </title>
<script defer src="https://unpkg.com/lucide@0.447.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"GameFont";src:url("https://files.catbox.moe/tniqln.ttf") format("truetype");font-display:swap}
:root{--line:#e0c994;--text:#3b2615;--muted:#8a6d4b;--pri:#4caf50;--pri-d:#2e7d32;--danger:#d9534f;--gold:#ffc83d;--gold-d:#9a5b00;--wood:#5b3a29;--wood-d:#3b2615;--cream:#fdf1d3;--cream2:#f1dfae;--r:8px;--hh:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.35 "GameFont","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background-color:#8fd16a;background-image:linear-gradient(45deg,#84c761 25%,transparent 25%,transparent 75%,#84c761 75%),linear-gradient(45deg,#84c761 25%,transparent 25%,transparent 75%,#84c761 75%);background-size:40px 40px;background-position:0 0,20px 20px;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.sm{font-size:12px}
svg.lucide{width:18px;height:18px;flex:none;vertical-align:middle}
.coin{font-size:1.05em;line-height:1;display:inline-block}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.big{font-size:28px;line-height:1;display:flex}
.btn{background:var(--pri);color:#fff;border:2px solid var(--wood-d);border-bottom-width:4px;border-radius:var(--r);padding:7px 14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{border-bottom-width:2px;margin-top:2px}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.alt{background:var(--cream);color:var(--pri-d)}
.btn.ghost{background:var(--cream);color:var(--text)}
.btn:disabled{opacity:.5}
.field{width:100%;padding:9px 12px;border:2px solid var(--wood);border-radius:var(--r);background:#fffaf0;margin-bottom:10px}
.field:focus{outline:3px solid var(--gold);outline-offset:-1px}
.err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-bottom:6px}
.seg{display:flex;border:2px solid var(--wood);border-radius:var(--r);overflow:hidden;background:var(--cream);margin-bottom:12px}
.seg button{flex:1;padding:7px 6px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);display:flex;align-items:center;z-index:30;color:var(--cream)}
.icon-btn{width:38px;height:38px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:#7a4f2a;border:2px solid var(--wood-d);border-bottom-width:4px;color:var(--cream);flex:none}
.avatar{width:36px;height:36px;border-radius:var(--r);background:var(--gold);color:var(--wood-d);border:2px solid var(--wood-d);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.hdr-user{flex:1;min-width:0;line-height:1.15}
.hdr-user b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-user small{color:#e5c99a;font-size:12px}
.hdr-money{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--gold);background:var(--wood-d);border:2px solid #8a6d4b;border-radius:var(--r);padding:3px 10px;flex:none}
.menu{position:fixed}
.menu .who{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.menu .wtxt{min-width:0;line-height:1.2}
.menu .wtxt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .wtxt small{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button{display:flex;align-items:center;width:100%;text-align:left;font-weight:700}
.menu button .mi{display:flex;align-items:center;justify-content:center;flex:none}
.menu button.out .mi{border-color:var(--danger)}
main{max-width:560px;margin:0 auto;padding:calc(var(--hh) + 14px) 12px 28px}
.sec-title{font-size:14px;font-weight:800;color:var(--wood-d);display:flex;gap:6px;align-items:center;margin:4px 0 8px}
.animal{font-size:40px;line-height:1;color:var(--wood)}
.animal svg.lucide{width:34px;height:34px}
.animal .cimg{display:block;width:1.2em;height:1.2em;object-fit:contain;border-radius:.2em;-webkit-user-drag:none;user-select:none}
.need{align-items:center;font-weight:800}
.reward{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:13px;color:var(--wood-d);background:#fff3c4;border:2px solid var(--wood);border-radius:4px;padding:0 7px}
.bar{width:88%;height:9px;background:var(--wood-d);border:2px solid var(--wood-d);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(45deg,#6bc84a 25%,#7ed957 25%,#7ed957 50%,#6bc84a 50%,#6bc84a 75%,#7ed957 75%);background-size:14px 14px}
.pbadge{width:38px;height:38px;border-radius:var(--r);background:var(--cream);border:2px solid var(--wood);display:flex;align-items:center;justify-content:center;color:var(--wood)}
.pbadge svg.lucide{width:22px;height:22px}
.pbadge .emo{font-size:22px;line-height:1}
.pl{font-size:12px;font-weight:800;display:flex;align-items:center;gap:3px;background:var(--wood-d);color:var(--cream);border-radius:4px;padding:0 7px;white-space:nowrap}
.pl svg.lucide{width:14px;height:14px}
.pn{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cream)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--cream);border:2px solid var(--wood);border-radius:var(--r);padding:8px;display:flex;gap:10px;align-items:center;width:100%;text-align:left}
.rbody{flex:1;min-width:0}
.rname{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;color:var(--muted);font-weight:600}
.chips span{display:inline-flex;align-items:center;gap:3px}
.chips svg.lucide{width:14px;height:14px}
.empty{padding:24px 12px;text-align:center;color:var(--wood);font-weight:700;background:var(--cream);border:2px dashed var(--wood);border-radius:var(--r)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{width:100%;max-width:420px;max-height:90vh;overflow:auto;padding:16px}
.sheet h3{margin-bottom:10px;font-size:18px}
.sheet p{margin-bottom:6px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;padding:7px 14px;font-size:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
.mood{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;line-height:1.3}
.mood.g{background:var(--gold);color:var(--wood-d)}
.mood.s{background:#cfd4d1;color:#4b5563}
.shop{display:flex;flex-direction:column}
.shop-empty{text-align:center;font-weight:700}
.price{font-weight:800;font-size:15px;color:var(--gold-d);white-space:nowrap}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dhead .animal{font-size:38px;margin:0}
.dreq{display:flex;align-items:center;gap:8px;padding:4px 8px;border:2px solid var(--wood);border-radius:var(--r);background:#fffaf0;margin-bottom:4px}
.dreq.done{background:#e3f4d0;border-color:var(--pri-d)}
.dreq .dn{flex:1;font-weight:700}
.dreq .dq{font-weight:800}
.dreq svg.lucide{width:20px;height:20px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.itile{background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.itile.off{opacity:.45}
.ibox{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--cream2);border:2px solid var(--wood);border-radius:var(--r)}
.ibox svg.lucide{width:24px;height:24px}
.ibox .emo{font-size:24px}
.icount{position:absolute;right:-6px;bottom:-6px;background:var(--wood-d);color:var(--cream);font-size:11px;font-weight:800;min-width:18px;text-align:center;border-radius:4px;padding:0 4px}
.iname{font-size:11px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:14px;text-align:center}
.stp{width:26px;height:26px;border:2px solid var(--wood-d);border-bottom-width:3px;border-radius:var(--r);background:var(--pri);color:#fff;font-weight:800;line-height:1}
.stp.minus{background:var(--cream);color:var(--text)}
.stp:disabled{opacity:.35}
.dsum{display:flex;align-items:center;justify-content:space-between;margin:10px 0 0;font-weight:800}
.mood{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.mood svg.lucide{width:12px;height:12px}
.mood.n{background:#d8efc4;color:#2e7d32}
.mood.a{background:#f8d0cc;color:#a02a22}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
body.shopbg{background-color:#ecd9a8;background-image:repeating-linear-gradient(90deg,#e6d09b 0 36px,#ecd9a8 36px 72px);background-size:auto;background-position:0 0}
main.flush{padding:var(--hh) 0 0}
main.flush .shop{min-height:calc(100vh - var(--hh));min-height:calc(100dvh - var(--hh))}
.igrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.icell{position:relative;background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r);padding:8px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.icell .ic{display:flex;align-items:center;justify-content:center;height:34px}
.icell .ic svg.lucide{width:30px;height:30px}
.icell .ic .emo{font-size:30px;line-height:1}
.iqty{position:absolute;top:-6px;right:-4px;background:var(--wood-d);color:var(--cream);font-size:11px;font-weight:800;border-radius:4px;padding:0 5px;border:1px solid var(--gold)}
.icell .iname{width:100%;text-align:center;padding:0 3px}
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:50vh;overflow-y:auto;padding:2px}
.ptile{background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r);padding:8px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.ptile:active{background:#e3f4d0}
.ptile .chips{justify-content:center;gap:0}
.dgrid{max-height:40vh;overflow-y:auto}
.sheet.slip{padding:0}
.slip-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;font-weight:800;font-size:17px}
.slip-head svg.lucide{width:20px;height:20px}
.slip-x{margin-left:auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-bottom-width:4px}
.slip-x svg.lucide{width:16px;height:16px}
.slip-body{padding:14px}
.slip-item{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slip-name{font-weight:800;font-size:18px;line-height:1.15}
.slip-sub{font-size:12px;font-weight:700;color:var(--muted);margin:1px 0 5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:0 7px;background:var(--cream2);border:2px solid var(--wood);border-radius:4px;font-size:11px;font-weight:800;color:var(--wood)}
.pill svg.lucide{width:12px;height:12px}
.bill{padding:7px 11px;background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r)}
.bl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-weight:700}
.bl span{color:var(--muted)}
.bl b{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bl.hr{height:0;padding:0;margin:5px 0;border-top:2px dashed var(--line)}
.bl.total{font-size:16px}
.bl.total span{color:var(--text);font-weight:800}
.bl b.ok{color:var(--pri-d)}
.bl b.bad{color:var(--danger)}
.slip-note,.slip-warn{display:flex;align-items:flex-start;gap:6px;margin-top:10px;font-size:12px;font-weight:700;line-height:1.3}
.slip-note{color:var(--muted)}
.slip-note svg.lucide,.slip-warn svg.lucide{width:15px;height:15px;margin-top:1px}
.slip-warn{align-items:center;padding:6px 9px;font-size:13px;font-weight:800;background:#fde4e2;color:#a02a22;border:2px solid var(--danger);border-radius:var(--r)}
.slip-warn.y{background:#fff3c4;color:var(--gold-d);border-color:var(--gold-d)}
.slip .acts{margin-top:14px}
.view-meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;font-weight:700}
.view-meta span{display:flex;align-items:center;gap:4px}
.view-meta svg.lucide{width:14px;height:14px}
.boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .45s}
.boot.out{opacity:0;pointer-events:none}
.boot h2{margin:6px 0 2px;font-size:25px}
.pbar{padding:3px;background:var(--wood);border:3px solid var(--wood-d);border-radius:var(--r)}
.ptrack{height:18px;overflow:hidden;background:#2b1b10;border-radius:4px}
.pfill{height:100%;width:4%;background:linear-gradient(45deg,#6bc84a 25%,#7ed957 25%,#7ed957 50%,#6bc84a 50%,#6bc84a 75%,#7ed957 75%);background-size:28px 28px;border-right:3px solid #b6f08f;animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:28px 0}}
.boot-pct{margin-top:9px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--wood-d)}
.boot-txt{min-height:19px;font-size:13px;font-weight:700;color:var(--muted)}
.boot-tip{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-size:12px;font-weight:700;color:var(--wood)}
.boot .btn{margin-top:12px}
@media (prefers-reduced-motion:reduce){
.boot *{animation:none!important}
}
.spin{display:inline-block;flex:none;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.field-box{margin-bottom:16px;overflow:hidden;border:3px solid var(--wood);border-radius:var(--r);box-shadow:0 5px 0 var(--wood-d)}
.sbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--wood);color:var(--cream);font-weight:800}
.sbar svg.lucide{color:var(--gold)}
.sbar{white-space:nowrap}
.sb-tag{margin-left:auto;padding:0 8px;font-size:12px;background:var(--gold);color:var(--wood-d);border-radius:4px}
@keyframes idle{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.order{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;background:#fffaf0;border:2px dashed var(--wood);border-radius:var(--r)}
.need{display:inline-flex;gap:4px;font-variant-numeric:tabular-nums;border:2px solid;border-radius:4px}
.need.ok{background:#e3f4d0;border-color:var(--pri-d);color:var(--pri-d)}
.need.no{background:#fde4e2;border-color:var(--danger);color:#a02a22}
.need .emo{line-height:1}
.field-box{background:var(--cream);border-color:var(--wood)}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}
.plot{position:relative;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 5px 5px;overflow:hidden;color:var(--text);background:#fffaf0;border:2px solid var(--line);border-radius:var(--r);transition:transform .1s}
.plot:active{transform:scale(.97)}
.pglyph{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pglyph>*{position:relative}
.plot:not(.locked):not(.empty) .pglyph::before{content:"";position:absolute;left:22%;right:22%;bottom:2px;height:9px;border-radius:50%;background:#a8723f;opacity:.5}
.plot .pbadge{width:40px;height:40px;background:#fff;border:2px solid var(--line);color:var(--wood)}
.plot .pn{color:var(--text);font-size:12px;font-weight:800}
.plot .pl{width:100%;height:20px;justify-content:center;background:var(--wood);color:var(--cream);border-radius:4px}
.plot .bar{width:100%;height:8px;background:#fff;border:1px solid #8cc66a;border-radius:4px}
.sprout{display:block;font-size:34px;line-height:1;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite alternate}
.plot.empty{background:transparent;border:2px dashed #c9ac6e}
.plot.empty .pbadge.add{background:transparent;border:2px dashed #c9ac6e;color:var(--muted)}
.plot .pl.go{background:var(--pri);color:#fff}
.plot.grow{background:#e8f5d8;border-color:#8cc66a}
.plot.grow .pl.timer{height:auto;padding:0;background:transparent;color:var(--pri-d);font-size:13px}
.plot.dry{background:#e1f1fb;border-color:#7ab8e3}
.plot .pbadge.wet{color:#1d6fb8;border-color:#7ab8e3;animation:pulse 1.1s ease-in-out infinite alternate}
.plot .pl.water{background:#1d6fb8;color:#fff}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
.plot.ready{background:#fff4c2;border-color:var(--gold);animation:glow 1.5s ease-in-out infinite alternate}
.plot.ready .pbadge{width:44px;height:44px;border-color:var(--gold);color:var(--pri-d);animation:bob 1s ease-in-out infinite alternate}
.plot.ready .pbadge svg.lucide{width:26px;height:26px}
.plot.ready .pbadge .emo{font-size:26px}
.plot .pl.gold{background:var(--gold);color:var(--wood-d)}
.plot.ready::after{content:"✨";position:absolute;right:5px;top:3px;font-size:14px;animation:twinkle 1.2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,200,61,0)}to{box-shadow:0 0 10px 2px rgba(255,200,61,.75)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes twinkle{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.plot.locked{background:#eceae4;border-color:#c9c6bb;color:#777}
.plot.locked .pbadge{background:#fff;color:#888;border-color:#c9c6bb}
.plot.locked .pl{background:#fff;color:var(--wood-d);border:1px solid #c9c6bb}
@media (prefers-reduced-motion:reduce){
.plot,.plot *,.plot::after{animation:none!important}
}
.inv-tabs{margin-bottom:12px}
.inv-tabs button{border-bottom-width:4px}
.inv-tabs button.on{border-color:var(--wood-d)}
.v-head{display:flex;gap:8px;padding:12px 12px 0}
.v-stat{flex:1;min-width:0;padding:5px 4px;text-align:center;background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r)}
.v-stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:18px;line-height:1.15;color:var(--wood-d);font-variant-numeric:tabular-nums}
.v-stat small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.v-prog{margin:10px 12px 0;padding:6px 10px 8px;background:#fffaf0;border:2px solid var(--wood);border-radius:var(--r)}
.v-prog .bar{width:100%;height:12px}
.v-empty{padding:26px 18px 30px;text-align:center}
.v-empty-frame{display:flex;align-items:center;justify-content:center;width:96px;height:96px;margin:0 auto 14px;font-size:44px;background:#fffaf0;border:6px solid #8a5b30;border-radius:4px;box-shadow:inset 0 0 0 4px var(--cream2),0 0 0 3px var(--wood-d),0 5px 0 3px var(--wood-d)}
.v-empty-t{font-size:17px;font-weight:800}
.v-empty-s{margin:2px 0 14px;font-size:13px;font-weight:700;color:var(--muted)}
.order{min-height:0;margin:6px 6px 0;padding:3px;gap:3px}
.need{padding:0 5px 0 3px;font-size:11px}
.need svg.lucide{width:14px;height:14px}
.need .emo{font-size:14px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb{position:relative;width:100%;min-width:0;background:var(--cream2);border:2px solid var(--wood);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.vthumb.v-avatar{aspect-ratio:1}
.vthumb.v-cover{aspect-ratio:16/9}

const TIPS = ['Mẹo: hoa chín nhanh hơn khi bạn dùng phân bón.', 'Mẹo: khách hào phóng thường bo nhiều xu hơn.', 'Mẹo: mở thêm ô đất để trồng nhiều hoa cùng lúc.', 'Mẹo: ảnh mới xuất hiện trong Cửa hàng trang bị mỗi 12 tiếng.', 'Mẹo: đừng để khách khó chịu chờ quá lâu nhé.'];

  };

const HARD_CHANCE = 0.6;               // xác suất ép ít nhất 1 loại phải đòi NHIỀU HƠN số đang có (đơn thử thách)

  { k: 's', w: 20, tip: [1, 2],  wait: 10, label: 'Keo kiệt',    icon: 'meh' },

const MOOD_BY = Object.fromEntries(MOODS.map(m => [m.k, m]));
/* ===== Nhân vật khách: dữ liệu lấy từ admin_data/customers ===== */
const HEX = /^#[0-9a-f]{6}$/i;

/* Màu nhãn tính cách do admin chọn (ưu tiên dữ liệu nhân vật hiện tại, không có thì dùng bản chụp trong đơn khách) */

    lo = Math.max(0, Math.round(lo)); hi = Math.max(lo, Math.round(hi));
    const wait = Math.min(180, Math.max(1, Number(c.wait) || m.wait));
    const weight = c.weight == null || c.weight === '' ? 10 : Math.max(0, Number(c.weight) || 0);
    return { id, name: String(c.name), emoji: c.emoji || '🙂', tone, label: c.label || m.label, color: HEX.test(c.color || '') ? c.color : '', tipMin: lo, tipMax: hi, wait, weight };
  });
  return l;
}
function pickChar(list) {
  const sum = list.reduce((a, c) => a + c.weight, 0);
  if (!(sum > 0)) return list[rand(0, list.length - 1)];
  let r = Math.random() * sum;

/* Hiển thị khách: ưu tiên dữ liệu nhân vật hiện tại (đổi ảnh ở admin là cập nhật ngay), thiếu thì dùng bản chụp lưu trong đơn khách */
function custLook(c, i) {

function weighted(w) {

}
/* Khách đòi KHÓ: ưu tiên loại hoa người chơi đang thiếu / không có trong kho (kho có nhiều thì gần như không bao giờ bị hỏi).
   Chỉ đòi thứ làm được kịp giờ: hoa phải chín trong ~85% thời gian chờ, đủ ô đất để trồng, đủ xu để mua hạt.
   Người chơi giàu hoặc nhiều ô đất sẽ gặp đơn nhiều loại, số lượng lớn hơn và thưởng cao hơn. */
const recentAsk = [];   // các loại hoa khách vừa đòi gần đây (tránh lặp mãi một loại)
function genCustomer(u, used, ctx) {
  const fl = flowerList(), money = u.money || 0, plots = u.plotCount || FREE_PLOTS;
  const cl = charList(), freeC = cl.filter(x => !used.has(x.id)), chr = pickChar(freeC.length ? freeC : cl);
  const mood = { k: chr.tone, label: chr.label, tip: [chr.tipMin, chr.tipMax], wait: chr.wait };
  const waitMs = mood.wait * 60000, stock = u.flowers || {}, seeds = u.seeds || {};
  const gms = f => (Number(f.growSeconds) || 60) * 1000, sp = f => Math.max(1, Number(f.seedPrice) || 1);
  const cyc = f => Math.floor(waitMs * 0.85 / gms(f));                 // số lứa trồng kịp trong thời gian khách chờ
  const feas = fl.filter(f => cyc(f) >= 1);
  const pool = feas.length ? feas : fl.slice().sort((a, b) => gms(a) - gms(b)).slice(0, 1);
  const wealth = money >= 20000 ? 2 : money >= 3000 ? 1 : 0, skill = plots >= 7 ? 2 : plots >= 4 ? 1 : 0;
  const minSp = Math.min(...pool.map(sp)), poor = money < minSp * 8;   // quá ít xu: chỉ mua nổi loại rẻ nhất
  const kinds = Math.min(3, weighted(KIND_W) + (wealth ? 1 : 0));
  // ngân sách ô đất và xu còn lại sau khi trừ phần các khách khác đang đòi
  let slots = plots, cash = money * 0.6;
  Object.entries(ctx.dem).forEach(([id, d]) => {
    const f = flowers[id]; if (!f) return;
    const ex = Math.max(0, d - (stock[id] || 0)); if (!ex) return;
    slots -= Math.ceil(ex / Math.max(1, cyc(f))); cash -= Math.max(0, ex - (seeds[id] || 0)) * sp(f);
  });
  const stLeft = f => Math.max(0, (stock[f.id] || 0) - (ctx.dem[f.id] || 0));
  const extraMax = f => Math.max(0, Math.min(Math.max(0, slots) * Math.max(1, cyc(f)), (seeds[f.id] || 0) + Math.floor(Math.max(0, cash) / sp(f))));
  const needs = {}; let hardUnits = 0;
  for (let k = 0; k < kinds; k++) {
    const forceHard = k === 0 && !poor && Math.random() < HARD_CHANCE;
    let cand = pool.filter(f => !needs[f.id]).map(f => {
      const ex = extraMax(f), sl = stLeft(f), maxQ = sl + ex;
      return { f, ex, sl, maxQ, w: maxQ > 0 ? Math.pow(1 / (1 + sl), 1.5) * (ex > 0 ? 1 : poor ? 0.7 : 0.15) * (recentAsk.includes(f.id) ? 0.2 : 1) / (1 + (ctx.cnt[f.id] || 0)) : 0 };
    }).filter(c => c.w > 0);
    if (forceHard) { const hc = cand.filter(c => c.ex > 0); if (hc.length) cand = hc; }   // đơn thử thách: chỉ chọn loại làm được nhưng phải trồng/mua thêm
    const sum = cand.reduce((x, c) => x + c.w, 0); if (!sum) break;
    let t = Math.random() * sum, pick = cand[cand.length - 1];
    for (const c of cand) { if ((t -= c.w) < 0) { pick = c; break; } }
    const cap = Math.min(pick.maxQ, 5 + (wealth ? 1 : 0) + (skill ? 1 : 0));
    let q = Math.min(cap, weighted(QTY_W) + (wealth ? 1 : 0));
    const room = Math.max(1, MAX_ORDER_ITEMS - Object.values(needs).reduce((a, b) => a + b, 0));
    if (pick.ex > 0 && pick.sl < room && (forceHard || q <= pick.sl)) q = Math.min(pick.maxQ, room, pick.sl + 1 + rand(0, forceHard ? 2 : 1));   // đòi nhiều hơn số đang có (không bị chặn bởi cap nữa)
    q = Math.max(1, Math.min(q, room));
    const ex = Math.max(0, q - pick.sl);
    if (ex > 0) { slots -= Math.ceil(ex / Math.max(1, cyc(pick.f))); cash -= Math.max(0, ex - (seeds[pick.f.id] || 0)) * sp(pick.f); hardUnits += ex; }
    needs[pick.f.id] = q;
  }
  if (!Object.keys(needs).length) {   // quá nghèo/hết ô: hỏi 1 bông loại rẻ nhất (ưu tiên loại có trong kho)
    const own = f => ((stock[f.id] || 0) > 0 || (seeds[f.id] || 0) > 0) ? 1 : 0;   // ưu tiên loại người chơi đang có, rồi mới tới loại rẻ
    const opts = pool.slice().sort((a, b) => own(b) - own(a) || sp(a) - sp(b)), fresh = opts.filter(f => !recentAsk.includes(f.id));
    const top = (fresh.length ? fresh : opts).slice(0, 4), f = top[rand(0, top.length - 1)]; if (f) needs[f.id] = 1;
  }
  let total = Object.values(needs).reduce((a, b) => a + b, 0);
  while (total > MAX_ORDER_ITEMS) {
    const big = Object.keys(needs).sort((a, b) => needs[b] - needs[a])[0];
    if (needs[big] <= 1) break;
    needs[big]--; total--; hardUnits = Math.min(hardUnits, total);
  }
  let base = 0;
  Object.entries(needs).forEach(([id, q]) => {
    base += (Number(flowers[id].sellPrice) || 1) * q;
    ctx.cnt[id] = (ctx.cnt[id] || 0) + 1; ctx.dem[id] = (ctx.dem[id] || 0) + q;
  });
  Object.keys(needs).forEach(id => recentAsk.push(id)); while (recentAsk.length > 4) recentAsk.shift();
  const hard = hardUnits > 0;
  if (hard) base = Math.round(base * (1 + 0.35 * Math.min(1, hardUnits / Math.max(1, total))));   // phải trồng thêm: thưởng cao hơn
  const tip = rand(mood.tip[0], mood.tip[1]);
  used.add(chr.id);
  return { needs, base, reward: base + tip, tip, ch: chr.id, cn: chr.name, ce: chr.emoji, m: mood.k, ml: mood.label, ...(chr.color ? { mc: chr.color } : {}), hard: hard ? 1 : 0, expiresAt: now() + mood.wait * 60000 };
}
let spawning = false;
async function spawnCustomers() {
  if (guest || spawning || !flowerList().length || !charList().length) return;
  spawning = true;
  try {
    await mutate(u => {
      const t = now(); u.customers = u.customers || {}; let ch = false;
      const act = Object.values(u.customers).filter(c => c && c.needs);
      const used = new Set(act.filter(c => c.ch != null).map(c => c.ch));
      const cnt = {}, dem = {};
      act.forEach(c => Object.entries(c.needs).forEach(([id, q]) => { cnt[id] = (cnt[id] || 0) + 1; dem[id] = (dem[id] || 0) + q; }));
      for (let i = 0; i < CUSTOMER_SLOTS; i++) {
        const c = u.customers['c' + i];
        if (c && c.needs) {
          if (!c.expiresAt) { c.expiresAt = t + CUSTOMER_WAIT_MIN * 60000; ch = true; }          // khách cũ chưa có hạn
          else if (c.expiresAt <= t) { u.customers['c' + i] = { readyAt: t + rand(COOLDOWN_MIN, COOLDOWN_MAX) * 1000 }; ch = true; } // chờ quá lâu: bỏ đi
          continue;
        }
        if (!c || !(c.readyAt > t)) { u.customers['c' + i] = genCustomer(u, used, { cnt, dem }); ch = true; }
      }
      if (!ch) return 'noop';
    }, true);
  } finally { spawning = false; }
}

/* ===== Định tuyến theo đường dẫn (/vuon, /shop, /tai-khoan…) ===== */
const ROUTES = { vuon: 'garden', 'hat-giong': 'seeds', kho: 'inv', shop: 'vip', 'tai-khoan': 'account', 'ngan-hang': 'bank', 'nhiem-vu': 'quest', 'xep-hang': 'lb', 'ban-be': 'friends' };
const PATH_OF = Object.fromEntries(Object.entries(ROUTES).map(([p, t]) => [t, p]));
const HASHMODE = location.protocol === 'file:' || /\.html?$/i.test(location.pathname); // mở file trực tiếp → dùng #/shop
function routeFromUrl() {
  const p = (HASHMODE ? location.hash.replace(/^#\/?/, '') : location.pathname).replace(/^\/|\/$/g, '');
  if (p === 'anh') return 'vip';
  return ROUTES[p] || 'garden';
}
function pushRoute(t, replace) {
  const url = HASHMODE ? '#/' + PATH_OF[t] : '/' + PATH_OF[t];
  if ((HASHMODE ? location.hash : location.pathname) === (HASHMODE ? url : url)) return;
  try { history[replace ? 'replaceState' : 'pushState'](null, '', url); } catch (e) { /* bỏ qua */ }
}
window.addEventListener('popstate', () => { if (user) switchTab(routeFromUrl(), true); });

/* ===== Vòng lặp mỗi giây ===== */
let sig = '';
function gardenSig(t) {
  let s = ''; const pd = user.plotData || {}, cs = user.customers || {};
  for (let i = 0; i < MAX_PLOTS; i++) { const p = pd['p' + i]; s += p ? (!p.readyAt ? 'W' : t >= p.readyAt ? 'R' : 'G') : '-'; }
  for (let i = 0; i < CUSTOMER_SLOTS; i++) {
    const c = cs['c' + i];
    s += (!c || (!c.needs && !(c.readyAt > t))) ? 'N' : (c.needs ? ((!c.expiresAt || c.expiresAt <= t) ? 'X' : 'C') : 'W');
  }
  return s;
}
function updateTimers(t) {
  document.querySelectorAll('.timer[data-until]').forEach(el => { el.textContent = fmtClock(Number(el.dataset.until) - t); });
  document.querySelectorAll('.sprout[data-until]').forEach(el => {
    const a = Number(el.dataset.from), b = Number(el.dataset.until), g = sproutAt((t - a) / (b - a));
    if (el.textContent !== g) el.textContent = g;
  });
  document.querySelectorAll('.bar b[data-until]').forEach(el => {
    const a = Number(el.dataset.from), b = Number(el.dataset.until);
    el.style.width = Math.min(100, Math.max(0, (t - a) / (b - a) * 100)) + '%';
  });
}
function tick() {
  if (!user) return;
  const t = now();
  updateTimers(t);
  const s = gardenSig(t);
  if (s !== sig) { sig = s; if (curTab === 'garden') renderGarden(); }
  if (/[NX]/.test(s.slice(MAX_PLOTS))) spawnCustomers();
  if (curTab === 'vip') ensureVipRotation();
  checkLoan();
  if (!guest) for (const g of lowGear(user)) { const k = g.id + ':' + curDur(g.v); if (!warnedGear.has(k)) { warnedGear.add(k); toast(`⚠️ ${g.v.name || 'Vật phẩm'} sắp hỏng, chỉ còn ${curDur(g.v)} độ bền. Hãy sửa chữa!`); if (curTab === 'garden') renderGarden(); break; } }
  if (curTab === 'quest' && questDay !== dayKey(t)) renderQuest();
  publishScore(); publishProfile();
  if (curTab === 'lb') renderLb();
}

/* ===== Ngân hàng: vay xu, lãi cố định, tịch thu tài sản khi quá hạn ===== */
const LOAN_MAX = 10000, LOAN_MIN = 1000, LOAN_RATE = 0.2, LOAN_MAX_DAYS = 10, SEIZE_RATE = 0.5, DAY_MS = 86400000;
const KIND = { deco: { n: 'Trang trí', i: 'crown' }, seed: { n: 'Hạt giống', i: 'sprout' }, fert: { n: 'Phân bón', i: 'sparkles' } };
const loanOwed = l => l ? Math.max(0, (Number(l.total) || 0) - (Number(l.paid) || 0)) : 0;
let bankForm = { amount: 5000, days: 7 }, noticeSeen = 0, loanBusy = false;
const bankClamp = () => Math.min(LOAN_MAX, Math.max(0, Math.floor(Number(bankForm.amount) || 0)));
const bankTotal = a => Math.ceil(a * (1 + LOAN_RATE));
/* Tài sản ngân hàng có thể tịch thu, định giá = SEIZE_RATE × giá mua */
function seizeCandidates(u) {
  const c = [], v = x => Math.floor((Number(x) || 0) * SEIZE_RATE);
  Object.entries(u.vip || {}).forEach(([id, p]) => { if (p && v(p.price) > 0) c.push({ k: 'deco', id, n: p.name || 'Vật phẩm trang trí', u: v(p.price), q: 1, url: safeUrl(p.url) }); });
  Object.entries(u.seeds || {}).forEach(([id, q]) => { const f = flowers[id]; if (f && q > 0 && v(f.seedPrice) > 0) c.push({ k: 'seed', id, n: 'Hạt ' + f.name, u: v(f.seedPrice), q, url: '' }); });
  Object.entries(u.fertilizers || {}).forEach(([id, q]) => { const f = fertilizers[id]; if (f && q > 0 && v(f.price) > 0) c.push({ k: 'fert', id, n: f.name, u: v(f.price), q, url: '' }); });
  return c;
}
/* Quá hạn: trừ xu trong ví trước, thiếu thì tịch thu tài sản (ít dư nhất), dư thì hoàn xu, hết tài sản thì xóa nợ còn lại */
function applySeize(u, t) {
  const l = u.loan; if (!l || loanOwed(l) <= 0 || t < l.dueAt) return false;
  const owed = loanOwed(l); let need = owed;
  const note = { at: t, owed, money: 0, items: [], surplus: 0, forgiven: 0 };
  note.money = Math.min(u.money || 0, need); u.money = (u.money || 0) - note.money; need -= note.money;
  const cs = seizeCandidates(u);
  while (need > 0) {
    const live = cs.filter(c => c.q > 0); if (!live.length) break;
    const fit = live.filter(c => c.u >= need).sort((a, b) => a.u - b.u)[0];
    const c = fit || live.sort((a, b) => b.u - a.u)[0];
    const q = fit ? 1 : Math.min(c.q, Math.max(1, Math.floor(need / c.u)));
    c.q -= q; need -= q * c.u;
    const e = note.items.find(x => x.k === c.k && x.id === c.id);
    if (e) e.q += q; else note.items.push({ k: c.k, id: c.id, n: c.n, q, u: c.u, url: c.url });
    if (c.k === 'deco') { delete u.vip[c.id]; if (u.avatar === c.id) delete u.avatar; if (u.cover === c.id) delete u.cover; if (u.equip) for (const k of Object.keys(u.equip)) if (u.equip[k] === c.id) delete u.equip[k]; }
    else { const o = c.k === 'seed' ? u.seeds : u.fertilizers; o[c.id] -= q; if (o[c.id] <= 0) delete o[c.id]; }
  }
  if (need < 0) { note.surplus = -need; u.money += note.surplus; } else note.forgiven = need;
  u.loan = null; u.loanNotice = note;
  return true;
}
async function checkLoan() {
  const l = user && user.loan;

  loanBusy = true;

}

      if ((u.money || 0) < cost) return 'Không đủ tiền';
      u.money -= cost;
      u.seeds = u.seeds || {}; u.unlocked = u.unlocked || {};
      u.seeds[id] = (u.seeds[id] || 0) + n; u.unlocked[id] = true;
    });
    if (ok) { toast('Đã mua ' + n + ' hạt'); }
  },

  async buyFert(d) {
    const id = d.id, n = +d.n;
    const ok = await mutate(u => {
      const f = fertilizers[id]; if (!f) return 'Loại phân bón không còn tồn tại';
      const cost = (Number(f.price) || 0) * n;
      if ((u.money || 0) < cost) return 'Không đủ tiền';
      u.money -= cost;
      u.fertilizers = u.fertilizers || {};
      u.fertilizers[id] = (u.fertilizers[id] || 0) + n;
    });
    if (ok) { toast('Đã mua ' + n + ' phân bón'); }
  },
};

/* ===== Vào game: có tài khoản thì chơi, chưa có thì vào chế độ khách ===== */
async function ensureProfile(u) {
  const r = ref(db, 'users/' + u.uid);
  const snap = await get(r);
  if (!snap.exists()) {
    let saved = null; try { saved = sessionStorage.getItem('nt_name'); } catch (e) { /* bỏ qua */ }
    const nm = (pendingName || saved || u.displayName || (u.email || 'player').split('@')[0]).slice(0, 20);
    let savedH = null; try { savedH = sessionStorage.getItem('nt_handle'); } catch (e) { /* bỏ qua */ }
    const hd = pendingHandle || savedH || null;
    const prof = { username: nm, email: u.email || '', money: START_MONEY, plotCount: FREE_PLOTS, createdAt: serverTimestamp() };
    if (hd) prof.handle = hd;
    try {   // quà tân thủ: mỗi loại hạt giống + phân bón STARTER_QTY cái (đọc danh sách trực tiếp từ admin_data)
      const [fs, fz] = await Promise.all([get(ref(db, 'admin_data/flowers')), get(ref(db, 'admin_data/fertilizers'))]);
      const pack = s => { const v = s.val() || {}, o = {}; Object.keys(v).forEach(id => { if (v[id] && typeof v[id] === 'object') o[id] = STARTER_QTY; }); return o; };
      const sd = pack(fs), fe = pack(fz);
      if (Object.keys(sd).length) prof.seeds = sd;
      if (Object.keys(fe).length) prof.fertilizers = fe;
    } catch (e) { console.warn('starter gift', e); }
    await set(r, prof);
  } else if (u.email && !snap.val().email) {
    await set(ref(db, 'users/' + u.uid + '/email'), u.email);   // bổ sung e-mail nếu hồ sơ cũ còn thiếu
  }
  pendingName = null; pendingHandle = null; try { sessionStorage.removeItem('nt_name'); sessionStorage.removeItem('nt_handle'); } catch (e) { /* bỏ qua */ }
}
onAuthStateChanged(auth, async u => {
  if (restarting) return;
  if (!u) {
    if (started && !guest) { restartSession('Đang đăng xuất…'); return; }   // vừa đăng xuất: về giao diện khách
    if (started) return;
    boot.show('Đang tải tài nguyên…', 10);
    try { await startSession(null); await boot.done(); initNotices(); }
    catch (x) { boot.hide(); toast('Lỗi tải dữ liệu: ' + x.message); }
    return;
  }
  if (started && guest) { restartSession('Đang vào tài khoản…'); return; }   // khách vừa đăng nhập/đăng ký
  boot.show('Đang xác thực tài khoản…', 10);
  try {
    boot.set(14, 'Đang tải hồ sơ người chơi…');
    await ensureProfile(u);
    boot.set(24, 'Đang tải dữ liệu nông trại…');
    await startSession(u.uid);
    await boot.done(); initNotices();
  } catch (x) {
    boot.hide();
    toast('Lỗi tải dữ liệu: ' + x.message);
  }
});
/* ===== HỆ THỐNG THÔNG BÁO (popup toàn web + thư riêng) ===== */
const ntfShownThisLoad = new Set();            // không bật lại trong cùng 1 lần tải trang

const ntfImgKeep = new Map();   // giữ ảnh popup đã tải + giải mã sẵn
function ntfPreload(url, ms) {
  if (!url || ntfImgKeep.has(url)) return Promise.resolve();
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    const im = new Image(); im.decoding = 'async';
    im.onload = () => { ntfImgKeep.set(url, im); (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(fin); };
    im.onerror = fin; im.src = url;
    setTimeout(fin, ms || 8000);
  });
}
/* Lấy danh sách popup sắp hiện */
async function loadNotices() {
  const t = now(), list = [];
  const snap = await get(ref(db, 'admin_data/notifications'));
  const all = snap.val() || {};
  Object.entries(all).forEach(([id, n]) => {
    if (!n || n.scope !== 'all' || n.active === false) return;
    if (!(Number(n.expiresAt) > t)) return;                       // hết hạn
    if (ntfShownThisLoad.has(id)) return;
    list.push({ id, n, priv: false, ord: Number.isFinite(Number(n.order)) && n.order != null ? Number(n.order) : 1e9 });
  });
  if (uid && !guest) {                                              // thư riêng gửi cho người chơi
    try {
      const s2 = await get(ref(db, 'users/' + uid + '/inbox'));
      Object.entries(s2.val() || {}).forEach(([id, n]) => {
        if (!n || ntfShownThisLoad.has(id)) return;
        if (!(Number(n.expiresAt) > t)) { remove(ref(db, 'users/' + uid + '/inbox/' + id)).catch(() => {}); return; }
        const pn = all[id]; if (pn && pn.active === false) return;
        list.push({ id, n, priv: true, ord: pn && pn.order != null && Number.isFinite(Number(pn.order)) ? Number(pn.order) : 1e9 });
      });
    } catch (e) { /* chưa có quyền đọc inbox thì bỏ qua */ }
  }
  list.sort((a, b) => (a.ord - b.ord) || ((b.n.createdAt || 0) - (a.n.createdAt || 0)));
  return list;
}
/* Chạy trong màn hình tải: lấy danh sách + tải xong ảnh của mọi popup sắp hiện */
async function prepNotices(onProg) {
  try {
    const list = await loadNotices();
    const urls = [...new Set(list.map(x => safeUrl(x.n.imageUrl)).filter(Boolean))];
    let k = 0;
    await Promise.all(urls.map(u => ntfPreload(u).then(() => { k++; onProg && onProg(k / urls.length); })));
    return list;
  } catch (e) { console.warn('Thông báo:', e); return []; }
}
async function initNotices() {
  try {
    const list = await (noticePrep || prepNotices()); noticePrep = null;
    if (list.length) { await sleep(400); ntfShow(list, 0); }
  } catch (e) { console.warn('Thông báo:', e); }
}
function ntfShow(list, i) {
  document.getElementById('ntfOverlay')?.remove();
  if (i >= list.length) return;
  const { id, n, priv } = list[i];
  ntfShownThisLoad.add(id);
  const ov = document.createElement('div');
  ov.id = 'ntfOverlay'; ov.className = 'overlay';
  const img = safeUrl(n.imageUrl);
  ov.innerHTML = `<div class="sheet ntf" role="dialog" aria-modal="true">
    ${img ? `<img class="ntf-img" src="${esc(img)}" alt="" onerror="this.outerHTML='<div class=&quot;ntf-ph&quot;></div>'">` : '<div class="ntf-ph"></div>'}
    <div class="ntf-body">
      ${priv ? '<span class="ntf-tag">✉️ Thư dành riêng cho bạn</span>' : ''}
      <h3 class="ntf-title">${esc(n.title || 'Thông báo')}</h3>
      <p class="ntf-txt">${esc(n.content || '').replace(/\n/g, '<br>')}</p>
      <button type="button" class="ntf-close" data-ntf="ok">Đóng thông báo</button>
      ${list.length > 1 ? `<div class="ntf-cnt">${i + 1} / ${list.length}</div>` : ''}
    </div>
  </div>`;
  const next = () => { ov.remove(); ntfShow(list, i + 1); };
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-ntf]');
    if (!b && e.target !== ov) return;
    if (priv) remove(ref(db, 'users/' + uid + '/inbox/' + id)).catch(() => {});   // thư riêng: đọc xong thì xóa
    next();
  });
  document.body.appendChild(ov);
}
